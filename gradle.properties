org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# MC 1.21.1 需要 Java 21(本机没配 JAVA_HOME 时取消下面一行的注释并改成你的 JDK21 路径)
# org.gradle.java.home=C:/Program Files/Java/jdk-21

# 如需代理下载依赖(国内网络),取消注释并改成你的代理端口:
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7897
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7897
# systemProp.http.nonProxyHosts=localhost|127.0.0.1

# 下载超时与重试(网络不稳时有用,与代理无关)
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=15
systemProp.org.gradle.internal.repository.initial.backoff=1000
